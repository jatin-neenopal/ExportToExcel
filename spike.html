<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Export to Excel — Phase 0 spike</title>
  <script src="./js/tableau.extensions.1.latest.js"></script>
  <style>
    body { font: 12px -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #1c2b26; margin: 10px; }
    fieldset { border: 1px solid #dfe6e2; border-radius: 6px; margin: 0 0 8px; padding: 6px 8px; }
    label { display: grid; grid-template-columns: 120px 1fr; gap: 6px; align-items: center; margin: 3px 0; }
    input, select { font: inherit; padding: 3px 5px; border: 1px solid #c7d1cb; border-radius: 4px; }
    button { font: inherit; padding: 5px 10px; margin: 2px 2px 2px 0; border-radius: 5px; border: 1px solid #c7d1cb; background: #fff; cursor: pointer; }
    button.primary { background: #1c7a4d; color: #fff; border-color: #1c7a4d; font-weight: 600; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    #ctx { color: #5b6b65; margin-bottom: 6px; }
    table { border-collapse: collapse; width: 100%; margin-top: 6px; }
    td, th { border: 1px solid #dfe6e2; padding: 3px 5px; vertical-align: top; text-align: left; word-break: break-word; }
    tr.PASS td:nth-child(3) { color: #1c7a4d; font-weight: 600; }
    tr.FAIL td:nth-child(3) { color: #b3261e; font-weight: 600; }
    tr.WARN td:nth-child(3) { color: #a15c00; font-weight: 600; }
    /* The viz must render to be interactive, so it's offscreen rather than display:none. */
    #viz_host { position: absolute; left: -20000px; top: 0; width: 1200px; height: 900px; }
    #viz_host.peek { position: static; width: 100%; height: 400px; overflow: auto; border: 2px dashed #b3261e; }
  </style>
</head>
<body>
  <div id="ctx">Initialising…</div>

  <fieldset>
    <label>Worker URL <input id="workerUrl" placeholder="https://tableau-export-spike.<you>.workers.dev"></label>
    <label>Tableau pod URL <input id="server" placeholder="https://prod-useast-b.online.tableau.com"></label>
    <label>Site contentUrl <input id="site" placeholder="mysite"></label>
    <label>Spike key <input id="spikeKey" placeholder="(optional)"></label>
    <label>Workbook LUID <input id="wbid" placeholder="filled by S2, or paste one"></label>
    <label>S3 target <select id="target_dash"><option value="">(run S1 first)</option></select></label>
  </fieldset>

  <button id="run_all" class="primary">Run all (S2 → S1 → S4 → S3)</button>
  <button id="run_s2">S2 Resolve</button>
  <button id="run_s1">S1 Fetch .twb</button>
  <button id="run_s4">S4 REST data</button>
  <button id="run_s3">S3 Embed</button>
  <button id="dl_twb" disabled>Download fetched .twb</button>
  <button id="copy_report">Copy report (TSV)</button>
  <button id="clear">Clear</button>

  <table>
    <thead><tr><th>Spike</th><th>Check</th><th>Status</th><th>Detail</th></tr></thead>
    <tbody id="results"></tbody>
  </table>

  <div id="viz_host"></div>
  <script src="./spike.js"></script>
</body>
</html>
